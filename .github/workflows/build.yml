name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Dynamic Native Gradle Engine
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.0.2'

    - name: Force Generate Wrapper and Permissions
      run: |
        gradle wrapper --gradle-version 8.0.2
        chmod +x gradlew

    - name: Build Professional Debug APK
      run: ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Upload Finished Safe APK
      uses: actions/upload-artifact@v4
      with:
        name: Global-Live-TV-APK
        path: app/build/outputs/apk/debug/app-debug.apk
